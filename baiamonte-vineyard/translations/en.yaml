configuration:
  full_refresh_minutes:
    name: Full system refresh interval
    description: Minutes between complete Vineyard Operations refresh cycles. Runs weather, Gmail, finance, website publishing, disease screening, projections and alerts together.
  prediction_sources_minutes:
    name: External forecast refresh interval
    description: Minutes between free ensemble, SIAS, Sentinel-2 and seasonal evidence checks.
  external_public_location_queries_enabled:
    name: Allow public weather location queries
    description: Send the estate coordinates to the free Open-Meteo ensemble and seasonal services. No API credentials are used.
  sentinel_public_processing_enabled:
    name: Allow public Sentinel-2 block processing
    description: Send mapped vineyard block boundaries to the free Planetary Computer service to calculate vegetation trends. Leave off until the owner explicitly accepts this location disclosure.
  cistern_camera_entity:
    name: Cistern level camera
    description: Home Assistant camera entity used to make the visual cistern water-level estimate.
  cistern_camera_light_entity:
    name: Cistern camera light
    description: Optional Home Assistant light or switch entity. Leave blank to discover a matching camera light automatically.
  cistern_level_ai_enabled:
    name: Estimate cistern level with AI
    description: Analyze the cistern camera during each full system refresh and keep the last valid estimate if analysis is unavailable.
  cistern_level_initial_percent:
    name: Initial cistern level estimate
    description: Starting percentage used until the first valid camera analysis. The current visual estimate is 5 percent.
  tv_map_brightness_percent:
    name: TV traffic map brightness
    description: Brightness for both ADS-B and AIS TV maps. 100 is neutral; the recommended default is 125.
  tv_weather_zoom_level:
    name: Weather TV map zoom
    description: Extra zoom steps for the Baiamonte precipitation map. 0 is regional, 2 is recommended, and 6 is the closest view.
  tv_adsb_target_size_percent:
    name: Aircraft target size
    description: Size of aircraft symbols on the ADS-B TV map. 100 is native size; 115 is recommended for the 32-inch TV.
  tv_ais_target_size_percent:
    name: Vessel target size
    description: Size of vessel symbols on the AIS TV map. 100 is native size.
  whatsapp_native_groups_enabled:
    name: Enable eligible Meta groups
    description: Enable only after Meta confirms this WhatsApp business account can use the restricted Groups API.
  imessage_bridge_url:
    name: Baiamonte iMessage Mac bridge
    description: Local or VPN URL of the Mac relay signed into the separate Baiamonte Apple Account.
  imessage_bridge_token:
    name: iMessage bridge token
    description: Private shared token for the Baiamonte Mac relay. Apple credentials never belong here.
  imessage_allowed_handles:
    name: Allowed vineyard iMessage contacts
    description: Optional comma-separated worker phone numbers or Apple addresses accepted by the relay.
  tv_home_airport_enabled:
    name: Show home airport on ADS-B TV
    description: Show the selected airport on the ADS-B map with aviation weather, official disruption notices and Etna impact screening.
  tv_home_airport_icao:
    name: Home airport ICAO code
    description: Four-letter ICAO airport code. Use LICC for Catania Fontanarossa (CTA).
  etna_enabled:
    name: Mount Etna monitoring
    description: Show the Etna pages and check official INGV, Civil Protection and VAAC sources.
  etna_refresh_minutes:
    name: Etna check interval
    description: Minutes between official-source Etna checks and eruption/activity alerts.
  etna_webcam_codes:
    name: INGV Etna cameras
    description: Comma-separated official camera codes to show. Recommended Ecv,Emv,Ent,Env.
  cellar_mode:
    name: Cellar mode
    description: Choose Demo for configurable moving tank examples, or Live for database and tank-monitor records only.
  cellar_demo_tanks:
    name: Demo tank data
    description: One tank per comma using Name|capacity L|variety|stage|level %|temperature C|density SG|Brix|pH.
  cellar_live_sensors:
    name: Live tank sensors
    description: One vessel per comma using Tank code or name|level entity|temperature entity|density entity|Brix entity|pH entity. Level may report percent or liters.
