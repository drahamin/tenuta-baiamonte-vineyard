configuration:
  full_refresh_minutes:
    name: Intervallo aggiornamento completo
    description: Minuti tra gli aggiornamenti completi di Vineyard Operations. Sincronizza meteo, Gmail, finanza, sito, pressione malattie, proiezioni e avvisi.
  prediction_sources_minutes:
    name: Intervallo fonti previsionali esterne
    description: Minuti tra i controlli gratuiti di ensemble, SIAS, Sentinel-2 e previsioni stagionali.
  external_public_location_queries_enabled:
    name: Consenti interrogazioni meteo pubbliche
    description: Invia le coordinate della tenuta ai servizi gratuiti Open-Meteo ensemble e stagionale. Non vengono usate credenziali API.
  sentinel_public_processing_enabled:
    name: Consenti elaborazione pubblica Sentinel-2
    description: Invia i confini mappati dei blocchi al servizio gratuito Planetary Computer per calcolare le tendenze vegetative. Lascia disattivato finché il proprietario non accetta esplicitamente questa divulgazione della posizione.
  cistern_camera_entity:
    name: Telecamera livello cisterna
    description: Entità telecamera di Home Assistant usata per la stima visiva del livello dell'acqua.
  cistern_camera_light_entity:
    name: Luce telecamera cisterna
    description: Entità luce o interruttore opzionale di Home Assistant. Lascia vuoto per cercare automaticamente una luce abbinata alla telecamera.
  cistern_rtsp_url:
    name: Flusso RTSP locale cisterna
    description: URL RTSP locale protetto della telecamera cisterna sempre attiva. Viene usato solo nell'add-on per un fotogramma IA corrente e non viene mai mostrato o registrato.
  vineyard_north_rtsp_url:
    name: Flusso RTSP locale Vigneto Nord
    description: URL RTSP locale protetto riservato alle future evidenze visive a inquadratura fissa. Non viene mai mostrato o registrato e i risultati restano soggetti a revisione.
  cistern_level_ai_enabled:
    name: Stima livello cisterna con IA
    description: Analizza la telecamera durante ogni aggiornamento completo e conserva l'ultima stima valida se l'analisi non è disponibile.
  cistern_level_initial_percent:
    name: Stima iniziale livello cisterna
    description: Percentuale iniziale usata fino alla prima analisi valida. La stima visiva attuale è 5 percento.
  tv_map_brightness_percent:
    name: Luminosità mappe traffico TV
    description: Luminosità delle mappe ADS-B e AIS sulla TV. 100 è neutro; il valore consigliato è 125.
  tv_weather_zoom_level:
    name: Zoom mappa meteo TV
    description: Passi di zoom aggiuntivi per la mappa delle precipitazioni di Baiamonte. 0 è regionale, 2 è consigliato e 6 è la vista più ravvicinata.
  tv_adsb_target_size_percent:
    name: Dimensione bersagli aerei
    description: Dimensione dei simboli degli aeromobili sulla mappa ADS-B TV. 100 è la dimensione nativa; 115 è consigliato per la TV da 32 pollici.
  tv_ais_target_size_percent:
    name: Dimensione bersagli navali
    description: Dimensione dei simboli delle navi sulla mappa AIS TV. 100 è la dimensione nativa.
  whatsapp_native_groups_enabled:
    name: Abilita gruppi Meta idonei
    description: Abilita solo dopo la conferma di Meta che questo account WhatsApp Business può usare la Groups API limitata.
  imessage_bridge_url:
    name: Bridge Mac iMessage Baiamonte
    description: URL locale o VPN del relay Mac collegato all'Apple Account Baiamonte separato.
  imessage_bridge_token:
    name: Token bridge iMessage
    description: Token privato condiviso per il relay Mac Baiamonte. Le credenziali Apple non vanno inserite qui.
  imessage_allowed_handles:
    name: Contatti iMessage del vigneto consentiti
    description: Numeri di telefono o indirizzi Apple dei lavoratori, separati da virgole, accettati dal relay.
  tv_home_airport_enabled:
    name: Mostra aeroporto principale su ADS-B TV
    description: Mostra l'aeroporto selezionato sulla mappa ADS-B con meteo aeronautico, avvisi ufficiali e valutazione dell'impatto dell'Etna.
  tv_home_airport_icao:
    name: Codice ICAO aeroporto principale
    description: Codice ICAO di quattro lettere. Usa LICC per Catania Fontanarossa (CTA).
  etna_enabled:
    name: Monitoraggio Etna
    description: Mostra le pagine Etna e controlla le fonti ufficiali INGV, Protezione Civile e VAAC.
  etna_refresh_minutes:
    name: Intervallo controllo Etna
    description: Minuti tra i controlli delle fonti ufficiali e gli avvisi di attività eruttiva.
  etna_webcam_codes:
    name: Telecamere INGV Etna
    description: Codici delle telecamere ufficiali separati da virgole. Consigliati Ecv,Emv,Ent,Env.
  cellar_mode:
    name: Modalità cantina
    description: Scegli Demo per esempi configurabili e dinamici, oppure Live per usare solo database e sensori delle vasche.
  cellar_demo_tanks:
    name: Dati vasche Demo
    description: Una vasca per virgola usando Nome|capacità L|vitigno|fase|livello %|temperatura C|densità SG|Brix|pH.
  cellar_live_sensors:
    name: Sensori reali delle vasche
    description: Una vasca per virgola usando Codice o nome|entità livello|entità temperatura|entità densità|entità Brix|entità pH. Il livello può essere in percentuale o litri.
  paypal_client_id:
    name: ID client PayPal Business statunitense
    description: ID client dell'account PayPal Business statunitense usato dal Registratore per pagamenti PayPal e con carta ospitata.
  paypal_client_secret:
    name: Segreto client PayPal Business statunitense
    description: Credenziale protetta del server abbinata all'ID client PayPal. Il pannello non mostra mai questo segreto.
  paypal_it_client_id:
    name: ID client PayPal Business italiano
    description: ID client dell'account PayPal Business italiano. Se configurato, viene usato come predefinito per i pagamenti in EUR.
  paypal_it_client_secret:
    name: Segreto client PayPal Business italiano
    description: Credenziale protetta del server per l'account PayPal Business italiano. Il pannello non mostra mai questo segreto.
  paypal_environment:
    name: Ambiente PayPal
    description: Usa Sandbox per le prove e Live solo quando l'applicazione PayPal Business statunitense è pronta per pagamenti reali.
