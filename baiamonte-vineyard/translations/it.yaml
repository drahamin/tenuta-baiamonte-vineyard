configuration:
  full_refresh_minutes:
    name: Intervallo aggiornamento completo
    description: Minuti tra gli aggiornamenti completi di Vineyard Operations. Sincronizza meteo, Gmail, finanza, sito, pressione malattie, proiezioni e avvisi.
  tv_map_brightness_percent:
    name: Luminosità mappe traffico TV
    description: Luminosità delle mappe ADS-B e AIS sulla TV. 100 è neutro; il valore consigliato è 125.
  tv_weather_zoom_level:
    name: Zoom mappa meteo TV
    description: Passi di zoom aggiuntivi per la mappa delle precipitazioni di Baiamonte. 0 è regionale, 2 è consigliato e 6 è la vista più ravvicinata.
  tv_home_airport_enabled:
    name: Mostra aeroporto principale su ADS-B TV
    description: Mostra l'aeroporto selezionato sulla mappa ADS-B con meteo aeronautico, avvisi ufficiali e valutazione dell'impatto dell'Etna.
  tv_home_airport_icao:
    name: Codice ICAO aeroporto principale
    description: Codice ICAO di quattro lettere. Usa LICC per Catania Fontanarossa (CTA).
  etna_enabled:
    name: Monitoraggio Etna
    description: Mostra le pagine Etna e controlla le fonti ufficiali INGV, Protezione Civile e VAAC.
  etna_refresh_minutes:
    name: Intervallo controllo Etna
    description: Minuti tra i controlli delle fonti ufficiali e gli avvisi di attività eruttiva.
  etna_webcam_codes:
    name: Telecamere INGV Etna
    description: Codici delle telecamere ufficiali separati da virgole. Consigliati Ecv,Emv,Ent,Env.
  cellar_mode:
    name: Modalità cantina
    description: Scegli Demo per esempi configurabili e dinamici, oppure Live per usare solo database e sensori delle vasche.
  cellar_demo_tanks:
    name: Dati vasche Demo
    description: Una vasca per virgola usando Nome|capacità L|vitigno|fase|livello %|temperatura C|densità SG|Brix|pH.
  cellar_temp_min_c:
    name: Temperatura minima cantina
    description: Crea un avviso sotto questa temperatura in °C. Solo controllo; non comanda impianti.
  cellar_temp_max_c:
    name: Temperatura massima cantina
    description: Crea un avviso sopra questa temperatura in °C.
  cellar_level_min_pct:
    name: Livello minimo vasca
    description: Crea un avviso sotto questa percentuale di riempimento.
  cellar_level_max_pct:
    name: Livello massimo vasca
    description: Crea un avviso sopra questa percentuale di riempimento.
  cellar_ph_min:
    name: pH minimo cantina
    description: Crea un avviso sotto questo pH registrato.
  cellar_ph_max:
    name: pH massimo cantina
    description: Crea un avviso sopra questo pH registrato.
  cellar_density_min_sg:
    name: Densità minima cantina
    description: Crea un avviso sotto questa densità specifica.
  cellar_density_max_sg:
    name: Densità massima cantina
    description: Crea un avviso sopra questa densità specifica.
