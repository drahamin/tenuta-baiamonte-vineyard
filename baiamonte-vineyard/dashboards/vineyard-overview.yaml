- title: Camera Health
  path: camera-diagnostics
  icon: mdi:heart-pulse
  type: sections
  max_columns: 3
  dense_section_placement: true
  badges: []
  sections:
  - type: grid
    title: Camera Services
    icon: mdi:server-network
    cards:
    - type: grid
      columns: 2
      square: false
      cards:
      - type: tile
        entity: binary_sensor.homebase_1_connected
        name: Eufy HomeBase
        icon: mdi:home-circle
        vertical: false
        tap_action:
          action: more-info
      - type: tile
        entity: script.update_all_eufy_camera_images
        name: Refresh Images
        icon: mdi:refresh
        vertical: false
        tap_action:
          action: more-info
    - type: markdown
      content: "**Camera diagnostics:** 33 camera entities, stream status, connectivity,
        batteries, Wi-Fi, camera enablement, motion and person detection are listed
        in the sections below. Offline and unavailable cameras remain visible."
  - type: grid
    title: All Cameras
    icon: mdi:camera-multiple
    cards:
    - type: custom:flex-table-card
      title: Camera Entity Status
      clickable: true
      selectable: false
      auto_format: true
      enable_search: true
      css:
        table+: 'font-size: 12px;'
        tr td+: 'padding: 3px 6px; line-height: 1.2;'
        thead th+: 'padding: 4px 6px;'
      entities:
      - camera.gate_doorbell
      - camera.front_gate
      - camera.front_yard
      - camera.driveway_entrance
      - camera.main_entrance
      - camera.vineyard_north
      - camera.rear_gate
      - camera.t8171t1025291b5f
      - camera.top_vineyard_360
      - camera.topvineyard
      - camera.rear_gate_360
      - camera.solar_wall_light_cam
      - camera.bbq_grill_2
      - camera.cisterna
      - camera.fox_ally
      - camera.indoor_cam
      - camera.generator_room
      - camera.kitchen
      - camera.palmento
      - camera.solar_room
      - camera.cistern_360
      - camera.east_360
      - camera.giangreco_360
      - camera.lower_vineyard
      - camera.south_vineyard_360
      - camera.top_east_vineyard
      - camera.vineyard_top
      - camera.top_vineyard_360_2
      - camera.solar_wall_light_cam_2
      - camera.vineyard_north_2
      - camera.mid_vineyard_north
      - camera.west_360
      - camera.west_etna_view
      columns:
      - name: Camera
        data: name
      - name: State
        data: state
        align: right
      - name: Changed
        data: last_changed
        align: right
        modify: 'x ? new Date(x).toLocaleString([], {month:''short'', day:''numeric'',
          hour:''2-digit'', minute:''2-digit''}) : ''-'''
  - type: grid
    title: Battery
    icon: mdi:battery-heart-variant
    cards:
    - type: custom:battery-state-card
      title: Camera Batteries
      default_config_base: false
      filter: {}
      sort:
        by: state
        desc: false
      collapse: 0
