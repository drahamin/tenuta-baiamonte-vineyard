- title: AI Assistant
  path: ai-assistant
  visible:
  - user: 50302bdc5bed42ac92dbfc2b4b4e5181
  - user: 127d17e52d524bbab8b55cf61c836134
  - user: 02d7044264574e8f9f43423a19253fd1
  - user: 11432746818f436a99e32d11801f5766
  - user: 61dba9669d734265a7ddb5a79f986a87
  - user: f402bf2ae76842088ac296979a9f4a8e
  - user: ff29cd2195a24f30aa3572532a4939bf
  - user: 6daf9b015ff741a5acabc1514505e2cd
  type: sections
  max_columns: 3
  dense_section_placement: true
  badges: []
  sections:
  - type: grid
    title: OpenAI Assist
    icon: mdi:message-processing-outline
    cards:
    - type: shortcut
      label: Talk to OpenAI
      description: Start the preferred Assist pipeline with the microphone
      icon: mdi:microphone-message
      color: deep-purple
      tap_action:
        action: assist
        pipeline_id: preferred
        start_listening: true
    - type: shortcut
      label: Type to OpenAI
      description: Open Assist without starting the microphone
      icon: mdi:message-text-outline
      color: indigo
      tap_action:
        action: assist
        pipeline_id: preferred
        start_listening: false
    - type: markdown
      content: These buttons use Home Assistant's **preferred Assist pipeline**. Set
        the OpenAI conversation agent as that pipeline's conversation agent once,
        and both controls will use it on the browser and in the mobile app.
  - type: grid
    title: Configuration
    icon: mdi:cog-outline
    cards:
    - type: shortcut
      label: Assist Pipelines
      description: Select OpenAI as the preferred conversation agent
      icon: mdi:account-voice
      color: blue
      tap_action:
        action: navigate
        navigation_path: "/config/voice-assistants/assistants"
    - type: shortcut
      label: Exposed Entities
      description: Choose exactly what OpenAI can read or control
      icon: mdi:shield-key-outline
      color: teal
      tap_action:
        action: navigate
        navigation_path: "/config/voice-assistants/expose"
    - type: shortcut
      label: OpenAI Integration
      description: Configure Conversation, AI Task, speech and model options
      icon: mdi:brain
      color: purple
      tap_action:
        action: navigate
        navigation_path: "/config/integrations/integration/openai_conversation"
    - type: markdown
      content: For safety, expose only Tenuta Baiamonte entities that the assistant
        genuinely needs. Keep locks, gates, generator controls and high-power switches
        unexposed unless voice control is intentional.
  - type: grid
    title: Useful Requests
    icon: mdi:lightbulb-on-outline
    cards:
    - type: markdown
      content: |-
        Try asking:

        - **What is the weather and wind at Baiamonte now?**
        - **Summarize today's solar production and Solcast forecast.**
        - **Which Baiamonte cameras or network devices are unavailable?**
        - **What needs attention before tonight?**

        Device questions and controls work only for entities exposed to Assist.
    - type: markdown
      content: "**Usage:** OpenAI API calls are billed separately from ChatGPT. Use
        the integration's recommended settings, keep responses concise, and set a
        project usage limit in the OpenAI platform. Web search, request storage, speech-to-text
        and text-to-speech can be enabled individually in the integration options
        when needed."
- title: Zigbee
  path: zha
  icon: mdi:zigbee
  subview: true
  back_path: /vineyard-overview/controls-power
  type: sections
  badges: []
  max_columns: 3
  dense_section_placement: true
  sections:
  - type: grid
    title: Zigbee Management
    icon: mdi:zigbee
    column_span: 3
    cards:
    - type: grid
      columns: 3
      square: false
      grid_options:
        columns: full
        rows: auto
