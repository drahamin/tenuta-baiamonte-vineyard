      - type: button
        name: ZHA Integration
        icon: mdi:zigbee
        tap_action:
          action: navigate
          navigation_path: "/config/integrations/integration/zha"
      - type: button
        name: Zigbee Devices
        icon: mdi:devices
        tap_action:
          action: navigate
          navigation_path: "/config/devices/dashboard?domain=zha"
      - type: button
        name: Automation
        icon: mdi:robot-outline
        tap_action:
          action: navigate
          navigation_path: "/config/automation/dashboard"
    - type: markdown
      content: "**Network health:** online devices should have recent activity and
        usable LQI/RSSI values. Click a row for device details. Battery devices may
        report less often than powered routers."
  - type: grid
    title: Zigbee Network
    icon: mdi:access-point-network
    column_span: 3
    cards:
    - type: custom:zha-network-card
      clickable: true
      sort_by: available
      columns:
      - name: Device
        prop: name
      - name: Online
        attr: available
        id: available
        modify: x || "false"
      - name: Manufacturer
        attr: manufacturer
      - name: Model
        attr: model
      - name: RSSI
        attr: rssi
      - name: LQI
        attr: lqi
      - name: Last Seen
        attr: last_seen
      - name: Power
        attr: power_source
