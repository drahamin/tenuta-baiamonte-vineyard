---
title: Vineyard Overview
views:
- title: Home
  path: default_view
  visible:
  - user: 50302bdc5bed42ac92dbfc2b4b4e5181
  - user: 127d17e52d524bbab8b55cf61c836134
  - user: 02d7044264574e8f9f43423a19253fd1
  - user: 11432746818f436a99e32d11801f5766
  - user: 61dba9669d734265a7ddb5a79f986a87
  - user: f402bf2ae76842088ac296979a9f4a8e
  - user: ff29cd2195a24f30aa3572532a4939bf
  - user: 6daf9b015ff741a5acabc1514505e2cd
  type: sections
  max_columns: 3
  dense_section_placement: true
  badges: []
  sections:
  - type: grid
    title: Estate Now
    icon: mdi:home-outline
    cards:
    - type: weather-forecast
      entity: weather.forecast_home
      name: Tenuta Baiamonte
      show_current: true
      show_forecast: true
      forecast_type: daily
    - type: grid
      columns: 2
      square: false
      cards:
      - type: clock
        clock_size: small
        time_zone: Europe/Rome
        show_seconds: false
      - type: alarm-panel
        entity: alarm_control_panel.homebase_1
        name: Estate Security
        states:
        - arm_home
        - arm_away
        - arm_night
    - type: entities
      title: Outdoor Conditions
      state_color: true
      entities:
      - entity: sensor.gw2000a_outdoor_temperature
        name: Temperature
      - entity: sensor.gw2000a_feels_like_temperature
        name: Feels Like
      - entity: sensor.gw2000a_humidity
        name: Humidity
      - entity: sensor.gw2000a_wind_speed
        name: Wind
      - entity: sensor.gw2000a_daily_rain_rate_piezo
        name: Rain Today
  - type: grid
    title: Solar & Operations
    icon: mdi:solar-power
    cards:
    - type: grid
      columns: 2
      square: false
      cards:
      - type: tile
        entity: sensor.wifi_din_rail_switch_with_metering_power
        name: Estate Load
        vertical: false
        tap_action:
          action: more-info
        icon: mdi:home-lightning-bolt-outline
      - type: tile
        entity: sensor.wifi_din_rail_40a_main_daily_consumption
        name: Used Today
        vertical: false
        tap_action:
          action: more-info
        icon: mdi:counter
      - type: tile
        entity: sensor.solcast_pv_forecast_power_now
        name: Solar Available Now
        vertical: false
        tap_action:
          action: more-info
        icon: mdi:white-balance-sunny
      - type: tile
        entity: sensor.solcast_pv_forecast_forecast_remaining_today
        name: Forecast Remaining
        vertical: false
        tap_action:
          action: more-info
        icon: mdi:weather-sunset-down
    - type: conditional
      conditions:
      - entity: sensor.baiamonte_total_output_power
        state_not: unavailable
      - entity: sensor.baiamonte_total_output_power
        state_not: unknown
      card:
        type: tile
        entity: sensor.baiamonte_total_output_power
        name: Growatt Solar Output
        icon: mdi:solar-power
        vertical: false
        tap_action:
          action: more-info
    - type: entities
      title: Solcast Forecast
      entities:
      - entity: sensor.solcast_pv_forecast_forecast_today
        name: Today
      - entity: sensor.solcast_pv_forecast_peak_forecast_today
        name: Peak Power Today
      - entity: sensor.solcast_pv_forecast_peak_time_today
        name: Peak Time Today
      - entity: sensor.solcast_pv_forecast_forecast_tomorrow
        name: Tomorrow
    - type: picture-glance
      title: Front Gate
      entity: camera.gate_doorbell
      image_entity: image.gate_doorbell_event_image
      aspect_ratio: 58%
      fit_mode: cover
      entities:
      - entity: binary_sensor.gate_doorbell_ringing
      tap_action:
        action: more-info
  - type: grid
    title: Vineyard Today
    icon: mdi:fruit-grapes-outline
    cards:
    - type: grid
      columns: 3
      square: false
      cards:
      - type: button
        name: Open Work
        icon: mdi:clipboard-check-outline
        tap_action:
          action: navigate
          navigation_path: /0c04eef6_baiamonte_vineyard?view=projects
      - type: button
        name: Alerts
        icon: mdi:alert-circle-outline
        tap_action:
          action: navigate
          navigation_path: /0c04eef6_baiamonte_vineyard?view=inbox
      - type: button
        name: Disease Pressure
        icon: mdi:virus-outline
        tap_action:
          action: navigate
          navigation_path: /0c04eef6_baiamonte_vineyard?view=treatments
      - type: button
        name: Lab Reviews
        icon: mdi:flask-outline
        tap_action:
          action: navigate
          navigation_path: /0c04eef6_baiamonte_vineyard?view=labs
      - type: button
        name: Treatments
        icon: mdi:sprayer-variant
        tap_action:
          action: navigate
          navigation_path: /0c04eef6_baiamonte_vineyard?view=treatments
      - type: button
        name: Inbox
        icon: mdi:inbox-arrow-down-outline
        tap_action:
          action: navigate
          navigation_path: /0c04eef6_baiamonte_vineyard?view=inbox
    - type: button
      name: Open Vineyard Operations
      icon: mdi:fruit-grapes
      tap_action:
        action: navigate
        navigation_path: /0c04eef6_baiamonte_vineyard
  - type: grid
    title: Aircraft Over Baiamonte
    icon: mdi:airplane
    cards:
    - type: custom:flex-table-card
      title: Live Local ADS-B
      entities:
      - sensor.baiamonte_aircraft
      sort_by: seen+
      max_rows: 15
      columns:
      - name: Flight
        data: aircraft.flight
        modify: 'x ? x.trim() : ''-'''
      - name: ICAO
        data: aircraft.hex
      - name: Altitude
        data: aircraft.alt_baro
        modify: 'x == ''ground'' ? ''Ground'' : (x ? Math.round(x).toLocaleString()
          + '' ft'' : ''-'')'
      - name: Speed
        data: aircraft.gs
        modify: 'x ? Math.round(x) + '' kt'' : ''-'''
      - name: Heading
        data: aircraft.track
        modify: 'x !== undefined ? Math.round(x) + ''°'' : ''-'''
      - id: seen
        name: Seen
        data: aircraft.seen
        modify: 'x !== undefined ? Math.round(x) + '' s'' : ''-'''
    - type: button
      name: Open Live Aircraft Map
      icon: mdi:radar
      show_state: false
      tap_action:
        action: url
        url_path: http://192.168.0.10:8080
    - type: markdown
      content: Aircraft are read directly from the **Baiamonte ADS-B receiver**. If
        the table is empty, the receiver may simply have no aircraft in range.
