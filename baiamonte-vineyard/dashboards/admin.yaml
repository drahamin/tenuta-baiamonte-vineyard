    type: sections
    max_columns: 3
    dense_section_placement: true
    sections:
      - type: grid
        title: Baiamonte services
        cards:
          - type: entities
            title: Application updates
            state_color: true
            show_header_toggle: false
            entities:
              - entity: update.baiamonte_vineyard_update_2
                name: Vineyard Operations
              - entity: update.baiamonte_ads_b_update
                name: ADS-B
              - entity: update.baiamonte_ais_update
                name: AIS
              - entity: update.baiamonte_lte_update
                name: LTE manager
          - type: grid
            columns: 2
            square: false
            cards:
              - type: button
                name: Vineyard app
                icon: mdi:fruit-grapes
                tap_action:
                  action: navigate
                  navigation_path: /0c04eef6_baiamonte_vineyard
              - type: button
                name: App settings
                icon: mdi:cog-outline
                tap_action:
                  action: navigate
                  navigation_path: /hassio/addon/0c04eef6_baiamonte_vineyard/config
              - type: button
                name: Integrations
                icon: mdi:puzzle-outline
                tap_action:
                  action: navigate
                  navigation_path: /config/integrations
              - type: button
                name: Dashboards
                icon: mdi:view-dashboard-edit-outline
                tap_action:
                  action: navigate
                  navigation_path: /config/lovelace/dashboards
      - type: grid
        title: Data and processing
        cards:
          - type: markdown
            title: Vineyard data health
            content: |
              Live database, weather, inbox, laboratory, alert and website status is
              maintained by **Vineyard Operations**. Open **Operations control** for
              current values, last successful updates and recoverable errors.

              This avoids obsolete helper entities and always points to the
              authoritative status source.
          - type: entities
            title: Physical estate alerts
            state_color: true
            show_header_toggle: false
            entities:
              - entity: sensor.baiamonte_cistern_water_level
                name: Cistern camera estimate
              - entity: binary_sensor.baiamonte_cistern_low_water
                name: Cistern low water
          - type: grid
            columns: 2
            square: false
            cards:
              - type: button
                name: Operations control
                icon: mdi:cog-sync-outline
                tap_action:
                  action: navigate
                  navigation_path: /0c04eef6_baiamonte_vineyard?view=admin
              - type: button
                name: Review inbox
                icon: mdi:inbox-arrow-down-outline
                tap_action:
                  action: navigate
                  navigation_path: /0c04eef6_baiamonte_vineyard?view=inbox
      - type: grid
        title: Home Assistant
        cards:
          - type: entities
            title: Core status
            state_color: true
            show_header_toggle: false
            entities:
              - entity: sensor.backup_backup_manager_state
                name: Backup manager
              - entity: sensor.backup_last_successful_automatic_backup
                name: Last automatic backup
              - entity: binary_sensor.remote_ui
                name: Home Assistant Cloud
          - type: button
            name: Backups
            icon: mdi:backup-restore
            tap_action:
              action: navigate
              navigation_path: /config/backup

  - title: Operations
    path: operations
    icon: mdi:cog-sync-outline
    type: sections
    max_columns: 3
    dense_section_placement: true
    sections:
      - type: grid
        title: Processing & recovery
        icon: mdi:progress-wrench
        cards:
          - type: markdown
            content: |
              **Vineyard Operations is the authoritative control surface.** Use the
              controls below to inspect scheduled jobs, current processing, errors,
              recovery actions, storage, API cost and the immutable processing log.
          - type: grid
            columns: 2
            square: false
            cards:
              - type: button
                name: Operations control
                icon: mdi:cog-sync-outline
                tap_action:
                  action: navigate
                  navigation_path: /0c04eef6_baiamonte_vineyard?view=admin
              - type: button
                name: Processing log
                icon: mdi:history
                tap_action:
                  action: navigate
                  navigation_path: /0c04eef6_baiamonte_vineyard?view=admin
              - type: button
                name: Review inbox
                icon: mdi:inbox-arrow-down-outline
                tap_action:
                  action: navigate
                  navigation_path: /0c04eef6_baiamonte_vineyard?view=inbox
              - type: button
                name: Alert settings
                icon: mdi:bell-cog-outline
                tap_action:
                  action: navigate
                  navigation_path: /0c04eef6_baiamonte_vineyard?view=alert-settings
          - type: markdown
            title: Current queue
            content: |
              Open **Operations control** for the live intake queue, lab decisions,
              active alerts, weather-history age and latest database update.

              Processing and error are separate indicators there; hover an error
              indicator to read the actual failure.
      - type: grid
        title: External connections
        icon: mdi:connection
        cards:
          - type: grid
            columns: 2
            square: false
            cards:
              - type: button
                name: Gmail
                icon: mdi:gmail
                tap_action:
                  action: navigate
                  navigation_path: /0c04eef6_baiamonte_vineyard?view=mail
              - type: button
                name: WhatsApp
                icon: mdi:whatsapp
                tap_action:
                  action: navigate
                  navigation_path: /0c04eef6_baiamonte_vineyard?view=messages
              - type: button
                name: Social
                icon: mdi:account-multiple-outline
                tap_action:
                  action: navigate
                  navigation_path: /0c04eef6_baiamonte_vineyard?view=social
              - type: button
                name: Website publish
                icon: mdi:web-sync
                tap_action:
                  action: navigate
                  navigation_path: /0c04eef6_baiamonte_vineyard?view=admin
              - type: button
                name: Calendar & tasks
                icon: mdi:calendar-sync-outline
                tap_action:
                  action: navigate
                  navigation_path: /0c04eef6_baiamonte_vineyard?view=projects
              - type: button
                name: Finance sync
                icon: mdi:cloud-sync-outline
                tap_action:
                  action: navigate
                  navigation_path: /0c04eef6_baiamonte_vineyard?view=finance
      - type: grid
        title: Database & AI
        icon: mdi:database-cog-outline
        cards:
          - type: markdown
            title: Authoritative data
            content: |
              **MariaDB through Vineyard Operations is authoritative.**

              - Work and labor totals: **Work** and **Records**
              - Treatments and disease pressure: **Treatments** and **Today**
              - Review state and source evidence: **Inbox**
              - Current errors and update age: **Operations control**
          - type: entities
            title: Physical sensor retained in Home Assistant
            entities:
              - entity: sensor.baiamonte_cistern_water_level
                name: Cistern camera estimate
          - type: grid
            columns: 2
            square: false
            cards:
              - type: button
                name: Ask AI
                icon: mdi:head-lightbulb-outline
                tap_action:
                  action: navigate
                  navigation_path: /0c04eef6_baiamonte_vineyard?view=intelligence
              - type: button
                name: App configuration
                icon: mdi:tune-variant
                tap_action:
                  action: navigate
                  navigation_path: /hassio/addon/0c04eef6_baiamonte_vineyard/config

