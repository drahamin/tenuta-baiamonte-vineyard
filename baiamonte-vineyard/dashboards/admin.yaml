  - title: Power
    path: power
    icon: mdi:transmission-tower
    type: sections
    max_columns: 3
    sections:
      - type: grid
        title: Estate electrical
        cards:
          - type: grid
            columns: 2
            square: false
            cards:
              - type: tile
                entity: sensor.wifi_din_rail_40a_main_power
                name: Main load
              - type: tile
                entity: sensor.wifi_din_rail_40a_main_voltage
                name: Voltage
              - type: tile
                entity: sensor.wifi_din_rail_40a_main_current
                name: Current
              - type: tile
                entity: binary_sensor.wifi_din_rail_40a_main_problem
                name: Main protection
          - type: history-graph
            title: Main load — 24 hours
            hours_to_show: 24
            entities:
              - entity: sensor.wifi_din_rail_40a_main_power
                name: Estate load
      - type: grid
        title: Protected breakers
        cards:
          - type: entities
            title: Distribution
            state_color: true
            show_header_toggle: false
            entities:
              - entity: switch.wifi_din_rail_10a_cameras
                name: Camera circuit
              - entity: switch.wifi_din_rail_10a_lights
                name: Lighting circuit
              - entity: switch.wifi_din_rail_10a_outlets
                name: Outlet circuit
              - entity: switch.wifi_din_rail_10a_nokia_lte
                name: LTE circuit
          - type: button
            entity: switch.wifi_din_rail_40a_main
            name: Main breaker — hold to change
            icon: mdi:electric-switch
            show_state: true
            tap_action:
              action: more-info
            hold_action:
              action: toggle
              confirmation:
                text: Confirm changing the estate main breaker.
      - type: grid
        title: Solar commissioning
        cards:
          - type: markdown
            title: Solar possibility range
            content: >-
              {% set entity = 'sensor.solcast_pv_forecast_forecast_today' %}
              {% set analysis = state_attr(entity, 'analysis') or {} %}
              {% set low = state_attr(entity, 'estimate10') or analysis.get('estimate10_kwh') %}
              {% set likely = states(entity) %}
              {% set high = state_attr(entity, 'estimate90') or analysis.get('estimate90_kwh') %}
              ## ☀️ {{ likely if likely not in ['unknown','unavailable'] else '—' }} kWh
              **Most likely today**

              | ☁️ Cloudier | ☀️ Most likely | 🔆 Sunnier |
              |:--:|:--:|:--:|
              | **{{ low if low is not none else '—' }} kWh** | **{{ likely if likely not in ['unknown','unavailable'] else '—' }} kWh** | **{{ high if high is not none else '—' }} kWh** |

              Remaining: **{{ states('sensor.solcast_pv_forecast_forecast_remaining_today') }} kWh** · Tomorrow: **{{ states('sensor.solcast_pv_forecast_forecast_tomorrow') }} kWh**

              _Solcast probability range · P10 / P50 / P90_
          - type: markdown
            content: >-
              **Growatt SPF 5000 ES** with two **Felicity LPBA48100-OL** batteries
              (10.24 kWh nominal). USB inverter telemetry and battery CAN telemetry
              will populate this section as their Home Assistant entities become available.
          - type: entities
            title: Current solar entities
            state_color: true
            show_header_toggle: false
            entities:
              - entity: sensor.solcast_pv_forecast_power_now
                name: Solar production
              - entity: sensor.solcast_pv_forecast_forecast_today
                name: Forecast today
              - entity: sensor.solcast_pv_forecast_forecast_remaining_today
                name: Forecast remaining
              - entity: sensor.solcast_pv_forecast_peak_forecast_today
                name: Forecast peak
          - type: history-graph
            title: Solar forecast — 24 hours
            hours_to_show: 24
            entities:
              - entity: sensor.solcast_pv_forecast_power_now
                name: Estimated solar

  - title: User Tracking
    path: user-tracking
    icon: mdi:map-marker-account-outline
    type: sections
    max_columns: 3
    dense_section_placement: true
    sections:
      - type: grid
        title: Estate people map
        icon: mdi:map-marker-multiple-outline
        cards:
          - type: map
            title: Current reported locations
            auto_fit: true
            fit_zones: false
            hours_to_show: 0
            dark_mode: true
            entities:
              - entity: person.david_rahamin
                name: David Rahamin
              - entity: person.wendy_creque
                name: Wendy Creque
              - entity: person.giancarlo
                name: Giancarlo Pafumi
              - entity: person.giuseppe_regalia
                name: Giuseppe Regalia
              - entity: person.luca_schiliro_cognato
                name: Luca Schiliro Cognato
              - entity: person.sebastian_vinvi
                name: Sebastian Vinvi
              - entity: person.fede_camuto
                name: Fede Camuto
              - entity: person.carmela_pafumi
                name: Carmela Pafumi
              - entity: person.nunzio_testa
                name: Nunzio Testa
      - type: grid
        title: Presence and movement
        icon: mdi:account-clock-outline
        cards:
          - type: grid
            columns: 2
            square: false
            cards:
              - type: tile
                entity: person.david_rahamin
                name: David
                icon: mdi:account-circle
                tap_action:
                  action: more-info
              - type: tile
                entity: person.wendy_creque
                name: Wendy
                icon: mdi:account-circle
                tap_action:
                  action: more-info
              - type: tile
                entity: person.giancarlo
                name: Giancarlo
                icon: mdi:account-hard-hat
                tap_action:
                  action: more-info
              - type: tile
                entity: person.giuseppe_regalia
                name: Giuseppe
                icon: mdi:account-tie
                tap_action:
                  action: more-info
              - type: tile
                entity: person.luca_schiliro_cognato
                name: Luca
                icon: mdi:account-hard-hat
                tap_action:
                  action: more-info
              - type: tile
                entity: person.sebastian_vinvi
                name: Sebastian
                icon: mdi:leaf
                tap_action:
                  action: more-info
              - type: tile
                entity: person.fede_camuto
                name: Fede
                icon: mdi:account-circle
                tap_action:
                  action: more-info
          - type: markdown
            title: On-site status
            content: |
              {% set people = [
                ('David Rahamin','person.david_rahamin'),
                ('Wendy Creque','person.wendy_creque'),
                ('Giancarlo Pafumi','person.giancarlo'),
                ('Giuseppe Regalia','person.giuseppe_regalia'),
                ('Luca Schiliro Cognato','person.luca_schiliro_cognato'),
                ('Sebastian Vinvi','person.sebastian_vinvi'),
                ('Fede Camuto','person.fede_camuto')
              ] %}
              | Person | Status | Updated |
              |:--|:--|--:|
              {% for name, entity in people %}
              {% set value = states(entity) %}
              {% set age = as_timestamp(now()) - as_timestamp(states[entity].last_updated) if states[entity] else 999999 %}
              | **{{ name }}** | {% if age > 2700 %}🟡 **Stale / uncertain**{% elif value == 'home' %}🟢 **On site**{% elif value == 'not_home' %}⚪ Away{% else %}🟡 {{ value|replace('_',' ')|title }}{% endif %} | {{ relative_time(states[entity].last_updated) if states[entity] else '—' }} ago |
              {% endfor %}
      - type: grid
        title: Labor reconciliation
        icon: mdi:account-hard-hat-outline
        cards:
          - type: grid
            columns: 2
            square: false
            cards:
              - type: button
                name: Reconcile labor
