  - title: Power
    path: power
    icon: mdi:transmission-tower
    type: sections
    max_columns: 3
    sections:
      - type: grid
        title: Estate electrical
        cards:
          - type: grid
            columns: 2
            square: false
            cards:
              - type: tile
                entity: sensor.wifi_din_rail_switch_with_metering_power
                name: Main load
              - type: tile
                entity: sensor.wifi_din_rail_switch_with_metering_voltage
                name: Voltage
              - type: tile
                entity: sensor.wifi_din_rail_switch_with_metering_current
                name: Current
              - type: tile
                entity: sensor.wifi_din_rail_40a_main_daily_consumption
                name: Used today
          - type: history-graph
            title: Main load — 24 hours
            hours_to_show: 24
            entities:
              - entity: sensor.wifi_din_rail_switch_with_metering_power
                name: Estate load
      - type: grid
        title: Protected breakers
        cards:
          - type: entities
            title: Distribution
            state_color: true
            show_header_toggle: false
            entities:
              - entity: switch.wifi_din_rail_10a_cameras_switch
                name: Camera circuit
              - entity: switch.wifi_din_rail_10a_lights_switch
                name: Lighting circuit
              - entity: switch.wifi_din_rail_10a_outlets_switch
                name: Outlet circuit
              - entity: switch.wifi_din_rail_10a_nokia_lte_switch
                name: LTE circuit
          - type: button
            entity: switch.wifi_din_rail_switch_with_metering_switch
            name: Main breaker — hold to change
            icon: mdi:electric-switch
            show_state: true
            tap_action:
              action: more-info
            hold_action:
              action: toggle
              confirmation:
                text: Confirm changing the estate main breaker.
      - type: grid
        title: Solar commissioning
        cards:
          - type: markdown
            title: Solar possibility range
            content: >-
              {% set entity = 'sensor.solcast_pv_forecast_forecast_today' %}
              {% set analysis = state_attr(entity, 'analysis') or {} %}
              {% set low = state_attr(entity, 'estimate10') or analysis.get('estimate10_kwh') %}
              {% set likely = states(entity) %}
              {% set high = state_attr(entity, 'estimate90') or analysis.get('estimate90_kwh') %}
              ## ☀️ {{ likely if likely not in ['unknown','unavailable'] else '—' }} kWh most likely
              | Cloudier · P10 | Most likely · P50 | Sunnier · P90 |
              |:--|:--:|--:|
              | **{{ low if low is not none else '—' }} kWh** | **{{ likely if likely not in ['unknown','unavailable'] else '—' }} kWh** | **{{ high if high is not none else '—' }} kWh** |

              Remaining: **{{ states('sensor.solcast_pv_forecast_forecast_remaining_today') }} kWh** · Tomorrow: **{{ states('sensor.solcast_pv_forecast_forecast_tomorrow') }} kWh**

              _Probability values come directly from Solcast; absent ranges are not estimated locally._
          - type: markdown
            content: >-
              **Growatt SPF 5000 ES** with two **Felicity LPBA48100-OL** batteries
              (10.24 kWh nominal). USB inverter telemetry and battery CAN telemetry
              will populate this section as their Home Assistant entities become available.
          - type: entities
            title: Current solar entities
            state_color: true
            show_header_toggle: false
            entities:
              - entity: sensor.solcast_pv_forecast_power_now
                name: Solar production
              - entity: sensor.solcast_pv_forecast_forecast_today
                name: Forecast today
              - entity: sensor.solcast_pv_forecast_forecast_remaining_today
                name: Forecast remaining
              - entity: sensor.solcast_pv_forecast_peak_forecast_today
                name: Forecast peak
          - type: conditional
            conditions:
              - entity: sensor.baiamonte_total_output_power
                state_not: unavailable
              - entity: sensor.baiamonte_total_output_power
                state_not: unknown
            card:
              type: grid
              columns: 2
              square: false
              cards:
                - type: tile
                  entity: sensor.baiamonte_total_output_power
                  name: Growatt output
                  icon: mdi:solar-panel-large
                - type: tile
                  entity: sensor.baiamonte_total_energy_today
                  name: Solar today
                  icon: mdi:calendar-today
          - type: history-graph
            title: Actual & forecast solar — 24 hours
            hours_to_show: 24
            entities:
              - entity: sensor.baiamonte_total_output_power
                name: Growatt actual
              - entity: sensor.solcast_pv_forecast_power_now
                name: Solcast available

  - title: User Tracking
    path: user-tracking
    icon: mdi:map-marker-account-outline
    type: sections
    max_columns: 3
    dense_section_placement: true
    sections:
      - type: grid
        title: Estate people map
        icon: mdi:map-marker-multiple-outline
        cards:
          - type: map
            title: Current reported locations
            auto_fit: true
            fit_zones: true
            hours_to_show: 24
            dark_mode: true
            entities:
              - entity: person.david_rahamin
                name: David Rahamin
              - entity: person.wendy_creque
                name: Wendy Creque
              - entity: person.giancarlo_pefumi
                name: Giancarlo Pefumi
              - entity: person.giuseppe_regalia
                name: Giuseppe Regalia
              - entity: person.luca_schiliro_cognato
                name: Luca Schiliro Cognato
              - entity: person.sebastian_vinvi
                name: Sebastian Vinvi
              - entity: person.fede_camuto
                name: Fede Camuto
          - type: markdown
            title: Location detail
            content: >-
              {% set people = [
                'person.david_rahamin','person.wendy_creque','person.giancarlo_pefumi',
                'person.giuseppe_regalia','person.luca_schiliro_cognato',
                'person.sebastian_vinvi','person.fede_camuto'] %}
              | Person | Location | Source · accuracy | Updated |
              |:--|:--|:--|--:|
              {% for entity in people %}
              {% set source = state_attr(entity, 'source') %}
              {% set person_state = states[entity] %}
              | **{{ state_attr(entity, 'friendly_name') or (entity.split('.')[1]|replace('_',' ')|title) }}** | {{ states(entity)|replace('_',' ')|title }} | {{ source|replace('device_tracker.','')|replace('_',' ') if source else 'No tracker' }} · {{ state_attr(entity, 'gps_accuracy') or '—' }} m | {{ (relative_time(person_state.last_updated) ~ ' ago') if person_state else 'No entity' }} |
              {% endfor %}

              _Locations are the latest values reported by each person’s configured Home Assistant tracker. A stale phone or disabled location permission can leave an old position._
      - type: grid
        title: Presence and movement
        icon: mdi:account-clock-outline
        cards:
          - type: entities
            title: People status
            state_color: true
            show_header_toggle: false
            entities:
              - entity: person.david_rahamin
                name: David Rahamin
                secondary_info: last-changed
              - entity: person.wendy_creque
                name: Wendy Creque
                secondary_info: last-changed
              - entity: person.giancarlo_pefumi
                name: Giancarlo Pefumi
                secondary_info: last-changed
              - entity: person.giuseppe_regalia
                name: Giuseppe Regalia
                secondary_info: last-changed
              - entity: person.luca_schiliro_cognato
                name: Luca Schiliro Cognato
                secondary_info: last-changed
              - entity: person.sebastian_vinvi
                name: Sebastian Vinvi
                secondary_info: last-changed
              - entity: person.fede_camuto
                name: Fede Camuto
                secondary_info: last-changed
          - type: history-graph
            title: Presence history — 7 days
            hours_to_show: 168
            entities:
              - entity: person.david_rahamin
                name: David
              - entity: person.wendy_creque
                name: Wendy
              - entity: person.giancarlo_pefumi
                name: Giancarlo
              - entity: person.giuseppe_regalia
                name: Giuseppe
              - entity: person.luca_schiliro_cognato
                name: Luca
              - entity: person.sebastian_vinvi
                name: Sebastian
              - entity: person.fede_camuto
                name: Fede
      - type: grid
        title: Access and dashboard routing
        icon: mdi:account-key-outline
        cards:
          - type: markdown
            content: |
              | Account | Home Assistant role | Intended start dashboard |
              |:--|:--|:--|
              | **David / rahamin** | Administrator | Admin or Vineyard Overview |
              | **Wendy / creque** | Administrator | Vineyard Overview |
              | **Giancarlo** | Standard | Vineyard Overview |
              | **Giuseppe** | Standard | Vineyard Overview |
              | **Luca** | Standard | Vineyard Overview |
              | **Sebastian** | Standard | Vineyard Overview |
              | **Fede** | Standard | Vineyard Overview |
              | **display** | Standard wall panel | Display Panel |
              | **ipad** | Standard dedicated tablet | Baiamonte iPad |
              | **tv** | Standard display service | TV page |
              | **mqtt** | Service login only | No Person or dashboard |

              Finance remains available only inside Vineyard Operations to `rahamin`, `creque`, and `giuseppe`. Home Assistant administrator rights do not broaden that application rule.
          - type: grid
            columns: 2
            square: false
            cards:
              - type: button
                name: Manage people
                icon: mdi:account-multiple-outline
                tap_action:
                  action: navigate
                  navigation_path: /config/person
              - type: button
                name: Manage users
                icon: mdi:account-cog-outline
                tap_action:
                  action: navigate
                  navigation_path: /config/users
              - type: button
                name: Location integrations
                icon: mdi:cellphone-marker
                tap_action:
                  action: navigate
                  navigation_path: /config/integrations
              - type: button
                name: Zones
                icon: mdi:map-marker-radius-outline
                tap_action:
                  action: navigate
                  navigation_path: /config/zone
          - type: markdown
            content: >-
              **Dashboard start behavior:** Home Assistant stores a personal default dashboard for the signed-in device. Use a separate `display` and `ipad` account, then select **Display Panel** or **Baiamonte iPad** once in that device’s Profile. The managed installer restricts those dashboard views to the matching Home Assistant user when the account exists.

