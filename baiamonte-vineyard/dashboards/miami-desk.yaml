title: Baiamonte · Miami Desk
views:
  - title: Main
    path: home
    icon: mdi:home-lightning-bolt-outline
    type: sections
    max_columns: 1
    dense_section_placement: true
    sections:
      - type: grid
        cards:
          - type: markdown
            content: >-
              {% set soc = states('sensor.baiamonte_can_bank_soc') %}
              {% set status = states('sensor.baiamonte_can_bank_status') %}
              {% set remaining = states('sensor.baiamonte_can_bank_remaining_energy') %}
              **{{ now().strftime('%-I:%M %p') }} · Baiamonte**

              🔋 **{{ soc if soc not in ['unknown', 'unavailable'] else '—' }}% · {{ status | replace('_', ' ') | title }}** ·
              **{{ remaining if remaining not in ['unknown', 'unavailable'] else '—' }} kWh left**
          - type: grid
            columns: 3
            square: false
            cards:
              - type: gauge
                entity: sensor.baiamonte_can_bank_soc
                name: Battery
                min: 0
                max: 100
                needle: true
                severity:
                  red: 0
                  yellow: 30
                  green: 60
                tap_action:
                  action: navigate
                  navigation_path: /lovelace/battery-bank
              - type: vertical-stack
                cards:
                  - type: conditional
                    conditions:
                      - condition: numeric_state
                        entity: sensor.baiamonte_growatt_solar_input_power
                        above: -1
                    card:
                      type: gauge
                      entity: sensor.baiamonte_growatt_solar_input_power
                      name: Solar
                      min: 0
                      max: 5000
                      needle: true
                      severity:
                        red: 0
                        yellow: 300
                        green: 1000
                      tap_action:
                        action: navigate
                        navigation_path: /lovelace/solar
                  - type: conditional
                    conditions:
                      - condition: not
                        conditions:
                          - condition: numeric_state
                            entity: sensor.baiamonte_growatt_solar_input_power
                            above: -1
                      - condition: numeric_state
                        entity: sensor.solcast_pv_forecast_power_now
                        above: -1
                    card:
                      type: gauge
                      entity: sensor.solcast_pv_forecast_power_now
                      name: Solar forecast
                      min: 0
                      max: 5000
                      needle: true
                      severity:
                        red: 0
                        yellow: 300
                        green: 1000
                      tap_action:
                        action: navigate
                        navigation_path: /lovelace/solar
                  - type: conditional
                    conditions:
                      - condition: not
                        conditions:
                          - condition: numeric_state
                            entity: sensor.baiamonte_growatt_solar_input_power
                            above: -1
                      - condition: not
                        conditions:
                          - condition: numeric_state
                            entity: sensor.solcast_pv_forecast_power_now
                            above: -1
                    card:
                      type: markdown
                      content: |-
                        **Solar**

                        Source offline
              - type: gauge
                entity: sensor.wifi_din_rail_40a_main_power
                name: Load
                min: 0
                max: 2000
                needle: true
                severity:
                  green: 0
                  yellow: 750
                  red: 1400
                tap_action:
                  action: more-info
          - type: markdown
            content: |-
              {%- set online = states('binary_sensor.baiamonte_can_bank_all_batteries_online') -%}
              {%- set power = states('sensor.baiamonte_can_bank_discharging_power') -%}
              {%- set reserve = states('sensor.baiamonte_overnight_readiness') -%}
              {%- set cistern = states('sensor.baiamonte_cistern_water_level') -%}
              {%- set outside = states('sensor.gw2000a_outdoor_temperature') -%}
              {%- set humidity = states('sensor.gw2000a_humidity') -%}
              {%- set sunrise = 'Low' if 'short' in (reserve | lower) or 'not enough' in (reserve | lower) else 'Enough' if 'enough' in (reserve | lower) else '—' if reserve in ['unknown', 'unavailable'] else reserve -%}
              | Batteries | Supplying | Sunrise | Cistern | Outside | Humidity |
              | :---: | :---: | :---: | :---: | :---: | :---: |
              | {{ 'Online' if online == 'on' else 'Check' if online == 'off' else '—' }} | {{ power | float | round(0) | int if is_number(power) else '—' }} W | {{ sunrise }} | {{ cistern | float | round(0) | int if is_number(cistern) else '—' }}% | {{ outside | float | round(1) if is_number(outside) else '—' }}°C | {{ humidity | float | round(0) | int if is_number(humidity) else '—' }}% |
          - type: grid
            columns: 4
            square: false
            cards:
              - type: button
                name: Battery
                icon: mdi:battery-high
                icon_height: 28px
                tap_action:
                  action: navigate
                  navigation_path: /lovelace/battery-bank
              - type: button
                name: Solar
                icon: mdi:solar-power-variant
                icon_height: 28px
                tap_action:
                  action: navigate
                  navigation_path: /lovelace/solar
              - type: button
                name: Cameras
                icon: mdi:cctv
                icon_height: 28px
                tap_action:
                  action: navigate
                  navigation_path: /vineyard-overview/new-cameras
              - type: button
                name: More
                icon: mdi:dots-grid
                icon_height: 28px
                tap_action:
                  action: navigate
                  navigation_path: /vineyard-miami-desk/details

  - title: Details
    path: details
    icon: mdi:chart-box-outline
    type: sections
    max_columns: 1
    sections:
      - type: grid
        title: Estate details
        cards:
          - type: weather-forecast
            entity: weather.forecast_home
            name: Tenuta Baiamonte
            show_current: true
            show_forecast: true
            forecast_type: daily
          - type: glance
            columns: 3
            show_name: true
            show_state: true
            entities:
              - entity: sensor.gw2000a_outdoor_temperature
                name: Outside
              - entity: sensor.gw2000a_humidity
                name: Humidity
              - entity: sensor.gw2000a_wind_speed
                name: Wind
          - type: entities
            title: Battery and solar
            show_header_toggle: false
            state_color: true
            entities:
              - entity: sensor.baiamonte_can_bank_remaining_energy
                name: Energy remaining
              - entity: sensor.baiamonte_can_bank_charging_power
                name: Charging
              - entity: sensor.baiamonte_can_bank_discharging_power
                name: Supplying estate
              - entity: sensor.baiamonte_growatt_solar_input_energy_today
                name: Solar made today
              - entity: sensor.solcast_pv_forecast_forecast_remaining_today
                name: Solar remaining today
              - entity: sensor.solcast_pv_forecast_forecast_tomorrow
                name: Solar tomorrow
          - type: tile
            entity: alarm_control_panel.solar_room_2
            name: Security status
            icon: mdi:shield-home-outline
            tap_action:
              action: none
            hold_action:
              action: none
