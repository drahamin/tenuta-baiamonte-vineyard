title: Baiamonte Display Panel
views:
  - title: Home
    path: home
    icon: mdi:home-outline
    type: sections
    max_columns: 1
    dense_section_placement: true
    sections:
      - type: grid
        title: Vineyard now
        cards:
          - type: markdown
            content: >-
              # {{ states('sensor.gw2000a_outdoor_temperature') }}°C ·
              {{ states('weather.forecast_home') | replace('_', ' ') | title }}

              **Baiamonte** · {{ states('sensor.gw2000a_humidity') }}% humidity ·
              {{ states('sensor.gw2000a_wind_speed') }} km/h wind ·
              {{ states('sensor.gw2000a_daily_rain_rate_piezo') }} mm rain
          - type: glance
            columns: 4
            show_name: true
            show_state: true
            entities:
              - entity: sensor.gw2000a_outdoor_temperature
                name: Outside
                icon: mdi:thermometer
              - entity: sensor.gw2000a_humidity
                name: Humidity
                icon: mdi:water-percent
              - entity: sensor.gw2000a_wind_speed
                name: Wind
                icon: mdi:weather-windy
              - entity: sensor.gw2000a_daily_rain_rate_piezo
                name: Rain
                icon: mdi:weather-rainy
          - type: grid
            columns: 3
            square: false
            cards:
              - type: button
                name: Open work
                icon: mdi:clipboard-check-outline
                show_state: false
                tap_action:
                  action: navigate
                  navigation_path: /0c04eef6_baiamonte_vineyard
              - type: button
                name: Harvest
                icon: mdi:fruit-grapes
                show_state: false
                tap_action:
                  action: navigate
                  navigation_path: /0c04eef6_baiamonte_vineyard?view=harvest
              - type: button
                name: Alerts
                icon: mdi:alert-circle-outline
                show_state: false
                tap_action:
                  action: navigate
                  navigation_path: /0c04eef6_baiamonte_vineyard?view=alerts
  - title: Lights
    path: lights
    icon: mdi:lightbulb-group-outline
    type: sections
    max_columns: 1
    sections:
      - type: grid
        title: Building lights
        cards:
          - type: grid
            columns: 2
            square: false
            cards:
              - type: tile
                entity: light.switch_1_lightbulb
                name: Kitchen overhead
                tap_action: {action: toggle}
              - type: tile
                entity: light.switch_7_lightbulb
                name: Kitchen sink
                tap_action: {action: toggle}
              - type: tile
                entity: light.switch_6_lightbulb
                name: Patio strip
                tap_action: {action: toggle}
              - type: tile
                entity: light.switch_5_lightbulb
                name: Patio
                tap_action: {action: toggle}
              - type: tile
                entity: light.switch_3_lightbulb
                name: Toilette
                tap_action: {action: toggle}
              - type: tile
                entity: light.switch_2_lightbulb
                name: Warehouse
                tap_action: {action: toggle}
              - type: tile
                entity: light.switch_4_lightbulb
                name: Palmento
                tap_action: {action: toggle}
              - type: tile
                entity: light.switch_8_lightbulb
                name: Fox Den overhead
                tap_action: {action: toggle}

  - title: Access
    path: access
    icon: mdi:gate
    type: sections
    max_columns: 1
    sections:
      - type: grid
        title: Arrival and safety
        cards:
          - type: tile
            entity: alarm_control_panel.solar_room_2
            name: Security status · Pro
            icon: mdi:shield-home-outline
            tap_action: {action: none}
            hold_action: {action: none}
          - type: tile
            entity: binary_sensor.gate_doorbell_motion_detected_2
            name: Gate motion
            icon: mdi:motion-sensor
            tap_action: {action: none}
          - type: picture-entity
            entity: camera.gate_doorbell_2
            image: /local/baiamonte-logo.png
            name: Front Gate Doorbell
            show_state: false
            show_name: true
            camera_view: auto

  - title: Power
    path: power
    icon: mdi:flash-outline
    type: sections
    max_columns: 1
    sections:
      - type: grid
        title: Solar & estate load
        cards:
          - type: markdown
            content: >-
              {% set estimate = states('sensor.solcast_pv_forecast_power_now') %}
              # ☀️ {{ estimate if estimate not in ['unknown', 'unavailable'] else '—' }} W estimated

              **Buildings using {{ states('sensor.wifi_din_rail_40a_main_power') }} W** ·
              {{ states('sensor.wifi_din_rail_40a_main_voltage') }} V ·
              {{ states('sensor.wifi_din_rail_40a_main_current') }} A
          - type: glance
            columns: 3
            show_name: true
            show_state: true
            entities:
              - entity: sensor.solcast_pv_forecast_power_now
                name: Solar available
                icon: mdi:solar-power
              - entity: sensor.wifi_din_rail_40a_main_power
                name: Building load
                icon: mdi:home-lightning-bolt-outline
              - entity: sensor.wifi_din_rail_40a_main_voltage
                name: Supply voltage
                icon: mdi:sine-wave
          - type: entities
            title: Solar outlook
            show_header_toggle: false
            entities:
              - entity: sensor.solcast_pv_forecast_forecast_today
                name: Most likely today · P50
              - entity: sensor.solcast_pv_forecast_forecast_remaining_today
                name: Remaining today
              - entity: sensor.solcast_pv_forecast_forecast_tomorrow
                name: Most likely tomorrow
      - type: grid
        title: Building electrical panels
        cards:
          - type: tile
            entity: switch.wifi_din_rail_40a_main
            name: Estate building main
            icon: mdi:transmission-tower
            color: amber
            tap_action: {action: more-info}
            hold_action: {action: none}
          - type: grid
            columns: 2
            square: false
            cards:
              - type: tile
                entity: switch.wifi_din_rail_10a_cameras_switch
                name: Cameras
                icon: mdi:cctv
                features: [{type: toggle}]
              - type: tile
                entity: switch.wifi_din_rail_10a_lights_switch
                name: Building lights
                icon: mdi:lightbulb-group
                features: [{type: toggle}]
              - type: tile
                entity: switch.wifi_din_rail_10a_outlets_switch
                name: Building outlets
                icon: mdi:power-socket-eu
                features: [{type: toggle}]
              - type: tile
                entity: switch.wifi_din_rail_10a_nokia_lte_switch
                name: LTE backup
                icon: mdi:router-wireless
                features: [{type: toggle}]
          - type: entities
            title: Building circuit load
            state_color: true
            show_header_toggle: false
            entities:
              - entity: sensor.wifi_din_rail_10a_cameras_power
                name: Cameras
              - entity: sensor.wifi_din_rail_10a_lights_power
                name: Lights
              - entity: sensor.wifi_din_rail_10a_outlets_power
                name: Outlets
              - entity: sensor.wifi_din_rail_10a_nokia_lte_power
                name: LTE backup
      - type: grid
        title: Building service outlets
        cards:
          - type: grid
            columns: 2
            square: false
            cards:
              - type: tile
                entity: switch.smart_power_outlet_3
                name: Refrigerator
                icon: mdi:fridge-outline
                features: [{type: toggle}]
              - type: tile
                entity: switch.smart_power_outlet_2
                name: Wine refrigerator
                icon: mdi:bottle-wine-outline
                features: [{type: toggle}]
              - type: tile
                entity: switch.smart_power_outlet_5
                name: Ice maker
                icon: mdi:snowflake
                features: [{type: toggle}]
              - type: tile
                entity: switch.smart_power_outlet_6
                name: Dishwasher
                icon: mdi:dishwasher
                features: [{type: toggle}]
              - type: tile
                entity: switch.smart_power_outlet_4
                name: Washing machine
                icon: mdi:washing-machine
                features: [{type: toggle}]
              - type: tile
                entity: switch.smart_power_outlet_1
                name: Cistern pump
                icon: mdi:water-pump
                features: [{type: toggle}]
