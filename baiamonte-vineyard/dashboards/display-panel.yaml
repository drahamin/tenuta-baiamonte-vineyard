title: Baiamonte Display Panel
views:
  - title: Home
    path: home
    icon: mdi:home-outline
    type: sections
    max_columns: 1
    dense_section_placement: true
    sections:
      - type: grid
        title: Vineyard now
        cards:
          - type: markdown
            content: >-
              # {{ states('sensor.gw2000a_outdoor_temperature') }}°C ·
              {{ states('weather.forecast_home') | replace('_', ' ') | title }}

              **Baiamonte** · {{ states('sensor.gw2000a_humidity') }}% humidity ·
              {{ states('sensor.gw2000a_wind_speed') }} km/h wind ·
              {{ states('sensor.gw2000a_daily_rain_rate_piezo') }} mm rain
          - type: glance
            columns: 4
            show_name: true
            show_state: true
            entities:
              - entity: sensor.gw2000a_outdoor_temperature
                name: Outside
                icon: mdi:thermometer
              - entity: sensor.gw2000a_humidity
                name: Humidity
                icon: mdi:water-percent
              - entity: sensor.gw2000a_wind_speed
                name: Wind
                icon: mdi:weather-windy
              - entity: sensor.gw2000a_daily_rain_rate_piezo
                name: Rain
                icon: mdi:weather-rainy
          - type: grid
            columns: 3
            square: false
            cards:
              - type: button
                name: Open work
                icon: mdi:clipboard-check-outline
                show_state: false
                tap_action:
                  action: navigate
                  navigation_path: /0c04eef6_baiamonte_vineyard
              - type: button
                name: Harvest
                icon: mdi:fruit-grapes
                show_state: false
                tap_action:
                  action: navigate
                  navigation_path: /0c04eef6_baiamonte_vineyard?view=harvest
              - type: button
                name: Alerts
                icon: mdi:alert-circle-outline
                show_state: false
                tap_action:
                  action: navigate
                  navigation_path: /0c04eef6_baiamonte_vineyard?view=alerts
  - title: Lights
    path: lights
    icon: mdi:lightbulb-group-outline
    type: sections
    max_columns: 1
    sections:
      - type: grid
        title: Building lights
        cards:
          - type: grid
            columns: 2
            square: false
            cards:
              - type: tile
                entity: switch.light_1
                name: Kitchen overhead
                tap_action: {action: toggle}
              - type: tile
                entity: switch.kitchen_sink_light_switch
                name: Kitchen sink
                tap_action: {action: toggle}
              - type: tile
                entity: switch.patio_light_strip_switch
                name: Patio strip
                tap_action: {action: toggle}
              - type: tile
                entity: switch.patio_light_switch
                name: Patio
                tap_action: {action: toggle}
              - type: tile
                entity: switch.toilette_light_switch
                name: Toilette
                tap_action: {action: toggle}
              - type: tile
                entity: switch.warehouse_light_switch
                name: Warehouse
                tap_action: {action: toggle}

  - title: Access
    path: access
    icon: mdi:gate
    type: sections
    max_columns: 1
    sections:
      - type: grid
        title: Arrival and safety
        cards:
          - type: tile
            entity: alarm_control_panel.homebase_1
            name: Security status
            icon: mdi:shield-home-outline
            tap_action: {action: none}
            hold_action: {action: none}
          - type: tile
            entity: binary_sensor.gate_doorbell_motion_detected
            name: Gate motion
            icon: mdi:motion-sensor
            tap_action: {action: none}
          - type: picture-entity
            entity: camera.gate_doorbell
            image: /local/baiamonte-logo.png
            name: Front gate
            show_state: false
            show_name: true
            camera_view: auto

  - title: Power
    path: power
    icon: mdi:flash-outline
    type: sections
    max_columns: 1
    sections:
      - type: grid
        title: Estate power
        cards:
          - type: grid
            columns: 2
            square: false
            cards:
              - type: tile
                entity: sensor.wifi_din_rail_switch_with_metering_power
                name: Load
                icon: mdi:flash
              - type: tile
                entity: sensor.wifi_din_rail_switch_with_metering_voltage
                name: Voltage
                icon: mdi:sine-wave
              - type: tile
                entity: sensor.wifi_din_rail_switch_with_metering_current
                name: Current
                icon: mdi:current-ac
              - type: tile
                entity: sensor.solcast_pv_forecast_power_now
                name: Solar available now
                icon: mdi:solar-power
          - type: entities
            title: Solar outlook
            show_header_toggle: false
            entities:
              - entity: sensor.solcast_pv_forecast_forecast_today
                name: Most likely today · P50
              - entity: sensor.solcast_pv_forecast_forecast_remaining_today
                name: Remaining today
              - entity: sensor.solcast_pv_forecast_forecast_tomorrow
                name: Most likely tomorrow
          - type: entities
            title: Circuit status
            state_color: true
            show_header_toggle: false
            entities:
              - entity: sensor.wifi_din_rail_10a_cameras_power
                name: Cameras
              - entity: sensor.wifi_din_rail_10a_lights_power
                name: Lights
              - entity: sensor.wifi_din_rail_10a_outlets_power
                name: Outlets
              - entity: sensor.wifi_din_rail_10a_nokia_lte_power
                name: LTE backup
