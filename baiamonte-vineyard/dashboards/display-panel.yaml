title: Baiamonte Display Panel
views:
  - title: Home
    path: home
    icon: mdi:home-outline
    type: sections
    max_columns: 1
    dense_section_placement: true
    sections:
      - type: grid
        cards:
          - type: markdown
            content: >-
              **{{ now().strftime('%-I:%M %p') }} · Kitchen** · 🌡️
              **{{ states('sensor.gw2000a_outdoor_temperature') }}°C** ·
              {{ states('weather.forecast_home') | replace('_', ' ') | title }} ·
              {{ states('sensor.gw2000a_humidity') }}%
          - type: grid
            columns: 3
            square: false
            cards:
              - type: gauge
                entity: sensor.baiamonte_can_bank_soc
                name: Battery
                min: 0
                max: 100
                needle: true
                severity:
                  red: 0
                  yellow: 30
                  green: 60
                tap_action:
                  action: navigate
                  navigation_path: /lovelace/battery-bank
              - type: vertical-stack
                cards:
                  - type: conditional
                    conditions:
                      - condition: numeric_state
                        entity: sensor.baiamonte_growatt_solar_input_power
                        above: -1
                    card:
                      type: gauge
                      entity: sensor.baiamonte_growatt_solar_input_power
                      name: Solar
                      min: 0
                      max: 5000
                      needle: true
                      severity:
                        red: 0
                        yellow: 300
                        green: 1000
                      tap_action:
                        action: navigate
                        navigation_path: /lovelace/solar
                  - type: conditional
                    conditions:
                      - condition: not
                        conditions:
                          - condition: numeric_state
                            entity: sensor.baiamonte_growatt_solar_input_power
                            above: -1
                      - condition: numeric_state
                        entity: sensor.solcast_pv_forecast_power_now
                        above: -1
                    card:
                      type: gauge
                      entity: sensor.solcast_pv_forecast_power_now
                      name: Solar forecast
                      min: 0
                      max: 5000
                      needle: true
                      severity:
                        red: 0
                        yellow: 300
                        green: 1000
                      tap_action:
                        action: navigate
                        navigation_path: /lovelace/solar
                  - type: conditional
                    conditions:
                      - condition: not
                        conditions:
                          - condition: numeric_state
                            entity: sensor.baiamonte_growatt_solar_input_power
                            above: -1
                      - condition: not
                        conditions:
                          - condition: numeric_state
                            entity: sensor.solcast_pv_forecast_power_now
                            above: -1
                    card:
                      type: markdown
                      content: |-
                        **Solar**

                        Source offline
              - type: gauge
                entity: sensor.wifi_din_rail_40a_main_power
                name: Load
                min: 0
                max: 2000
                needle: true
                severity:
                  green: 0
                  yellow: 750
                  red: 1400
                tap_action:
                  action: navigate
                  navigation_path: /vineyard-display/power
          - type: grid
            columns: 4
            square: false
            cards:
              - type: custom:button-card
                entity: light.switch_1_lightbulb
                name: Overhead
                icon: mdi:ceiling-light
                show_state: true
                tap_action: {action: toggle}
                styles:
                  card: [height: 60px, padding: 4px]
                  icon: [width: 21px]
                  name: [font-size: 12px]
                  state: [font-size: 11px]
              - type: custom:button-card
                entity: light.switch_7_lightbulb
                name: Sink
                icon: mdi:wall-sconce-flat
                show_state: true
                tap_action: {action: toggle}
                styles:
                  card: [height: 60px, padding: 4px]
                  icon: [width: 21px]
                  name: [font-size: 12px]
                  state: [font-size: 11px]
              - type: custom:button-card
                entity: binary_sensor.gate_doorbell_motion_detected_2
                name: Gate
                icon: mdi:gate
                show_state: true
                tap_action:
                  action: navigate
                  navigation_path: /vineyard-display/access
                styles:
                  card: [height: 60px, padding: 4px]
                  icon: [width: 21px]
                  name: [font-size: 12px]
                  state: [font-size: 11px]
              - type: custom:button-card
                name: More
                icon: mdi:dots-grid
                tap_action:
                  action: navigate
                  navigation_path: /vineyard-display/lights
                styles:
                  card: [height: 60px, padding: 4px]
                  icon: [width: 21px]
                  name: [font-size: 12px]
          - type: markdown
            content: |-
              {%- set alarm = states('alarm_control_panel.solar_room_2') -%}
              {%- set online = states('binary_sensor.baiamonte_can_bank_all_batteries_online') -%}
              {%- set fridge = states('switch.smart_power_outlet_3') -%}
              {%- set dishwasher = states('switch.smart_power_outlet_6') -%}
              {%- set power = states('sensor.baiamonte_can_bank_discharging_power') -%}
              {%- set reserve = states('sensor.baiamonte_overnight_readiness') -%}
              {%- set cistern = states('sensor.baiamonte_cistern_water_level') -%}
              {%- set sunrise = 'Low' if 'short' in (reserve | lower) or 'not enough' in (reserve | lower) else 'Enough' if 'enough' in (reserve | lower) else '—' if reserve in ['unknown', 'unavailable'] else reserve -%}
              | Alarm | Bank | Fridge | Dishw. | Supply | Sunrise | Cistern |
              | :---: | :---: | :---: | :---: | :---: | :---: | :---: |
              | {{ 'Off' if alarm == 'disarmed' else 'Armed' if alarm.startswith('armed_') else 'ALARM' if alarm == 'triggered' else 'Wait' if alarm in ['arming', 'pending'] else '—' }} | {{ 'Online' if online == 'on' else 'Check' if online == 'off' else '—' }} | {{ fridge | title if fridge in ['on', 'off'] else '—' }} | {{ dishwasher | title if dishwasher in ['on', 'off'] else '—' }} | {{ power | float | round(0) | int if is_number(power) else '—' }} W | {{ sunrise }} | {{ cistern | float | round(0) | int if is_number(cistern) else '—' }}% |
  - title: Lights
    path: lights
    icon: mdi:lightbulb-group-outline
    type: sections
    max_columns: 1
    sections:
      - type: grid
        title: Building lights
        cards:
          - type: grid
            columns: 2
            square: false
            cards:
              - type: tile
                entity: light.switch_1_lightbulb
                name: Kitchen overhead
                tap_action: {action: toggle}
              - type: tile
                entity: light.switch_7_lightbulb
                name: Kitchen sink
                tap_action: {action: toggle}
              - type: tile
                entity: light.switch_6_lightbulb
                name: Patio strip
                tap_action: {action: toggle}
              - type: tile
                entity: light.switch_5_lightbulb
                name: Patio
                tap_action: {action: toggle}
              - type: tile
                entity: light.switch_3_lightbulb
                name: Toilette
                tap_action: {action: toggle}
              - type: tile
                entity: light.switch_2_lightbulb
                name: Warehouse
                tap_action: {action: toggle}
              - type: tile
                entity: light.switch_4_lightbulb
                name: Palmento
                tap_action: {action: toggle}
              - type: tile
                entity: light.switch_8_lightbulb
                name: Fox Den overhead
                tap_action: {action: toggle}

  - title: Access
    path: access
    icon: mdi:gate
    type: sections
    max_columns: 1
    sections:
      - type: grid
        title: Arrival and safety
        cards:
          - type: tile
            entity: alarm_control_panel.solar_room_2
            name: Security status · Pro
            icon: mdi:shield-home-outline
            tap_action: {action: none}
            hold_action: {action: none}
          - type: tile
            entity: binary_sensor.gate_doorbell_motion_detected_2
            name: Gate motion
            icon: mdi:motion-sensor
            tap_action: {action: none}
          - type: picture-entity
            entity: camera.gate_doorbell_2
            image: /local/baiamonte-logo.png
            name: Front Gate Doorbell
            show_state: false
            show_name: true
            camera_view: auto

  - title: Power
    path: power
    icon: mdi:flash-outline
    type: sections
    max_columns: 1
    sections:
      - type: grid
        title: Solar & estate load
        cards:
          - type: markdown
            content: >-
              {% set estimate = states('sensor.solcast_pv_forecast_power_now') %}
              # ☀️ {{ estimate if estimate not in ['unknown', 'unavailable'] else '—' }} W estimated

              **Buildings using {{ states('sensor.wifi_din_rail_40a_main_power') }} W** ·
              {{ states('sensor.wifi_din_rail_40a_main_voltage') }} V ·
              {{ states('sensor.wifi_din_rail_40a_main_current') }} A
          - type: glance
            columns: 3
            show_name: true
            show_state: true
            entities:
              - entity: sensor.solcast_pv_forecast_power_now
                name: Solar available
                icon: mdi:solar-power
              - entity: sensor.wifi_din_rail_40a_main_power
                name: Building load
                icon: mdi:home-lightning-bolt-outline
              - entity: sensor.wifi_din_rail_40a_main_voltage
                name: Supply voltage
                icon: mdi:sine-wave
          - type: entities
            title: Solar outlook
            show_header_toggle: false
            entities:
              - entity: sensor.solcast_pv_forecast_forecast_today
                name: Most likely today · P50
              - entity: sensor.solcast_pv_forecast_forecast_remaining_today
                name: Remaining today
              - entity: sensor.solcast_pv_forecast_forecast_tomorrow
                name: Most likely tomorrow
      - type: grid
        title: Building electrical panels
        cards:
          - type: tile
            entity: switch.wifi_din_rail_40a_main
            name: Estate building main
            icon: mdi:transmission-tower
            color: amber
            tap_action: {action: more-info}
            hold_action: {action: none}
          - type: grid
            columns: 2
            square: false
            cards:
              - type: tile
                entity: switch.wifi_din_rail_10a_cameras
                name: Cameras
                icon: mdi:cctv
                features: [{type: toggle}]
              - type: tile
                entity: switch.wifi_din_rail_10a_lights
                name: Building lights
                icon: mdi:lightbulb-group
                features: [{type: toggle}]
              - type: tile
                entity: switch.wifi_din_rail_10a_outlets
                name: Building outlets
                icon: mdi:power-socket-eu
                features: [{type: toggle}]
              - type: tile
                entity: switch.wifi_din_rail_10a_nokia_lte
                name: LTE backup
                icon: mdi:router-wireless
                features: [{type: toggle}]
          - type: entities
            title: Building circuit load
            state_color: true
            show_header_toggle: false
            entities:
              - entity: sensor.wifi_din_rail_10a_cameras_power_2
                name: Cameras
              - entity: sensor.wifi_din_rail_10a_lights_power_3
                name: Lights
              - entity: sensor.wifi_din_rail_10a_outlets_power_3
                name: Outlets
              - entity: sensor.wifi_din_rail_10a_nokia_lte_power_2
                name: LTE backup
      - type: grid
        title: Building service outlets
        cards:
          - type: grid
            columns: 2
            square: false
            cards:
              - type: tile
                entity: switch.smart_power_outlet_3
                name: Refrigerator
                icon: mdi:fridge-outline
                features: [{type: toggle}]
              - type: tile
                entity: switch.smart_power_outlet_2
                name: Wine refrigerator
                icon: mdi:bottle-wine-outline
                features: [{type: toggle}]
              - type: tile
                entity: switch.smart_power_outlet_5
                name: Ice maker
                icon: mdi:snowflake
                features: [{type: toggle}]
              - type: tile
                entity: switch.smart_power_outlet_6
                name: Dishwasher
                icon: mdi:dishwasher
                features: [{type: toggle}]
              - type: tile
                entity: switch.smart_power_outlet_4
                name: Washing machine
                icon: mdi:washing-machine
                features: [{type: toggle}]
              - type: tile
                entity: switch.smart_power_outlet_1
                name: Cistern pump
                icon: mdi:water-pump
                features: [{type: toggle}]
