  db_port: 3306
  db_name: baiamonte_vineyard
  db_user: baiamonte
  db_password: ""
  api_key: ""
  public_feed_token: ""
  public_publish_url: ""
  public_publish_token: ""
  public_publish_minutes: 15
  mcp_server_token: ""
  mcp_allow_writes: false
  mcp_allowed_hosts: "localhost:*,127.0.0.1:*,homeassistant.local:*"
  crew_entry_token: ""
  crew_default_name: "Giancarlo Pafumi"
  finance_usernames: "rahamin,creque,giuseppe"
  operations_usernames: "rahamin,creque,giuseppe,giancarlo,sebastian,cognato"
  viewer_usernames: "display,tv"
schema:
  db_host: str
  db_port: port
  db_name: str
  db_user: str
  db_password: password
  api_key: password?
  public_feed_token: password?
  # Keep this optional until an external website endpoint is configured.
  # Home Assistant's `url?` validator rejects an explicitly blank value.
  public_publish_url: str
  public_publish_token: password?
  public_publish_minutes: int(1,1440)
  mcp_server_token: password?
  mcp_allow_writes: bool
  mcp_allowed_hosts: str
  crew_entry_token: password?
  crew_default_name: str
  finance_usernames: str
  operations_usernames: str
  viewer_usernames: str
