name: Baiamonte Vineyard
version: "0.1.1"
slug: baiamonte_vineyard
description: Vineyard, harvest, cellar, weather, and reporting for Tenuta Baiamonte
url: https://github.com/drahamin/tenuta-baiamonte-vineyard
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:fruit-grapes
panel_title: Vineyard
panel_admin: false
ports:
  8099/tcp: 8099
  8100/tcp: null
options:
